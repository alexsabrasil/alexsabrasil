name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alexsabrasil

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300C2FF&color_dots=%23EBEDF0,%23B6E9FF,%2366D9FF,%230077FF,%230047AB
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300C2FF&color_dots=%23161B22,%23003355,%23006699,%230099CC,%2300C2FF

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
